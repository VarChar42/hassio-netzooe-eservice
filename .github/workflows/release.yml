name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v' custom_components/netzooe_eservice/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/netzooe_eservice/manifest.json
      - name: Build zip
        working-directory: custom_components/netzooe_eservice
        run: zip -r "$GITHUB_WORKSPACE/netzooe_eservice.zip" . -x "__pycache__/*"
      - uses: softprops/action-gh-release@v2
        with:
          files: netzooe_eservice.zip
